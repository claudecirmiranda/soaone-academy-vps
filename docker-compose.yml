# soaone Academy · portal estático atrás do Traefik que já roda na VPS
services:
  site:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.academy.rule=Host(`academy.soaone.com.br`)
      - traefik.http.routers.academy.entrypoints=websecure
      - traefik.http.routers.academy.tls.certresolver=letsencrypt
      - traefik.http.services.academy.loadbalancer.server.port=80

  # Publicador do Instagram: verifica o calendário a cada 5 minutos (instagram/README.md)
  instagram:
    image: python:3.12-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["python3", "-u", "publicar.py", "loop", "--intervalo", "300"]
    environment:
      - TZ=America/Sao_Paulo
      - MIDIA_DIR=/midia
    volumes:
      - ./instagram:/app
      - ./site/ig:/midia:ro
    labels:
      - traefik.enable=false
